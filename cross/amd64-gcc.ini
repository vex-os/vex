# I can't be fucked to build the cross compiler...
# It takes forever so I ain't subjecting myself to this

[binaries]
c = 'x86_64-elf-gcc'
c_ld = 'bfd'
ld = 'x86_64-elf-ld'
ar = 'x86_64-elf-ar'
strip = 'x86_64-elf-strip'
objcopy = 'x86_64-elf-objcopy'

[host_machine]
system = 'none'
kernel = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
