[constants]
target = 'x86_64-none-elf'

[binaries]
c = 'clang'
c_ld = 'lld'
ld = 'ld.lld'
ar = 'llvm-ar'
strip = 'llvm-strip'
objcopy = 'llvm-objcopy'

[built-in options]
c_args = ['--target=' + target, '-nostdlibinc']

[host_machine]
system = 'none'
kernel = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
