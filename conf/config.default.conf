arch amd64
envt clang

option ENABLE_KASSERT
option ENABLE_SMP

option TRACE_BLK_EVENTS
option TRACE_CHR_EVENTS
option TRACE_INITCALLS

option ENABLE_FBCONS
option ENABLE_BXCONS

driver ahci
driver pata
driver ps2kbd

driver ptable-gpt
driver ptable-mbr

filesys devfs
filesys echfs
filesys ext2
filesys fat
filesys minix
